<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Selected work by Elle Azhdari">
  <title>Elle Azhdari — Selected Work</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#work" aria-label="Elle Azhdari">
      <span>Elle</span>
      <span class="surname-swap">
        <span class="surname-default">Azhdari</span>
        <span class="surname-hover">Is Unbelievable</span>
      </span>
    </a>

    <nav class="site-nav" aria-label="Main navigation">
      <a href="#work">Work</a>
      <!-- Replace these placeholders with your actual pages/contact address. -->
      <a href="info.html">Info</a>

    </nav>
  </header>

  <main id="work" class="work-area">
    <!-- The path is drawn by script.js using the spiral settings. -->
    <svg id="art" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true">
      <path id="spiral"></path>
      <path id="spiral-extension"></path>
    </svg>
    <!-- The clickable project images are generated by script.js. -->
    <div id="pieces"></div>
  </main>

  <footer class="site-footer">
    <div class="filters" aria-label="Filter projects">
      <button class="filter active" data-filter="all" aria-pressed="true">All</button>
      <button class="filter" data-filter="art" aria-pressed="false">Art</button>
      <button class="filter" data-filter="commission" aria-pressed="false">Commission</button>
    </div>
    <span><a href="https://www.instagram.com/" target="_blank" rel="noopener">Instagram</a></span>
  </footer>

  <div class="scroll-hint">Scroll to explore <span aria-hidden="true">↕</span></div>

  <!-- Project detail: a scrollable layer, not a separate page. -->
  <section class="project-view" id="overlay" role="dialog" aria-modal="true" aria-labelledby="projectTitle" aria-hidden="true" inert>
    <div class="project-view-inner">
      <div class="project-topline">
        <span id="projectCategory"></span>
        <button id="close" class="project-close" type="button">Close ×</button>
      </div>
      <h1 id="projectTitle"></h1>
      <div id="projectGallery" class="project-gallery"></div>
      <div class="project-bottom">Elle Azhdari — Selected work</div>
    </div>
  </section>
</body>
</html>
